report_id = "line_downtime"
report_version = 1
mode = "prototype"
load_mode = "upsert"
timezone = "Africa/Cairo"
currency = "EGP"

[excel]
sheet = "Downtime"
header_row = 1
data_start_row = 2
open_mode = "dedicated_then_attach"
calculation_policy = "as_saved"
data_area = "used_range"
include_hidden_rows = true
adapter = "fixture"

[extraction]
target_cells_per_chunk = 250000
min_rows_per_chunk = 2
max_rows_per_chunk = 10000
projected_columns = ["event_date", "line", "event_id", "machine", "reason", "downtime_minutes", "planned_flag"]

[history]
business_key = ["event_date", "line", "event_id"]
event_date = "event_date"
lookback_days = 7
deletion_rule = "ignore"

[quality]
required_columns_block = true
max_duplicate_key_rate = 0.0
max_required_null_rate = 0.0
max_row_count_change_pct = 100.0
control_total_column = "downtime_minutes"
non_negative_columns = ["downtime_minutes"]
approved_categories = ["Breakdown", "Material", "Changeover", "Other"]

[output]
audience = "Maintenance and production management"
storage_allowed = ["tests/expected/downtime"]
retention_days = 365
ai_narrative_allowed = false

