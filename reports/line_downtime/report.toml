# Line Downtime Weekly
#
# Generated by the Factory from a business interview. The employee
# answered plain questions; this file is the technical translation.
#
# Values shown as PENDING_APPROVAL still need a named human. An agent
# may propose them but may never resolve them (Part 41.3).

report_id      = "line_downtime"
report_version = 1
mode           = "prototype"
load_mode      = "upsert"
timezone       = "PENDING_APPROVAL"
currency       = "PENDING_APPROVAL"

[excel]
sheet              = "Raw Data"                # [VARY]
header_row         = 1                         # [VARY]
data_start_row     = 2                         # [VARY]
open_mode          = "dedicated_then_attach"
calculation_policy = "as_saved"
data_area          = "table:tblProduction"     # [VARY]
include_hidden_rows = true
# The reference runs on the fixture adapter. A release containing this adapter
# fails architecture verification (Part 44.3 rule 1).
adapter            = "com"

[extraction]
target_cells_per_chunk = 250000
min_rows_per_chunk     = 2
max_rows_per_chunk     = 10000
projected_columns      = ["production_date", "line", "order_number", "model_code",
                          "produced_qty", "defect_qty", "category"]   # [VARY]


[history]
business_key   = ["event_date", "line", "event_id"]
event_date     = "PENDING_APPROVAL"
lookback_days  = 7
deletion_rule  = "ignore"

[quality]
required_columns_block   = true
max_duplicate_key_rate   = 0.0
max_required_null_rate   = 0.0
max_row_count_change_pct = "PENDING_APPROVAL"
control_total_column     = "Total downtime minutes"
approved_categories      = []

[output]
audience             = "Line Downtime Weekly"
storage_allowed      = ["D:/secure/downtime"]
retention_days       = "PENDING_APPROVAL"
ai_narrative_allowed = false

# Approvals are recorded in factory/approvals/<report_id>.approvals.jsonl
# with a hash of the exact approved value. Changing a value above voids
# its approval automatically.
[approvals]
business_key = { approved_by = "Sara Ahmed <sara.ahmed@example.com>", approved_at = "2026-08-18T05:50:00.053026+00:00", evidence = "setup review meeting 2026-08-18" }
load_mode = { approved_by = "Sara Ahmed <sara.ahmed@example.com>", approved_at = "2026-08-18T05:50:00.124593+00:00", evidence = "setup review meeting 2026-08-18" }
