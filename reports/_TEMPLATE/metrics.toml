# Metric registry for <REPORT_TITLE> (Constitution Part 10.2).
#
# ONE approved definition per KPI, company-wide. All trusted business metric
# logic lives in versioned .sql files. Python may orchestrate, validate, convert
# and format; JavaScript may render and filter approved pre-aggregations.
# Neither may contain a second hidden KPI formula.

# [metrics.<metric_id>]
# meaning       = "defective quantity divided by inspected quantity"
# formula_sql   = "sql/metrics.sql#defect_rate"
# source_fields = ["defect_qty", "inspected_qty"]
# grain         = ["day", "week", "month", "model", "line"]
# unit          = "percent"
# currency      = ""
# null_rule     = "null if inspected_qty is null"
# zero_rule     = "null if inspected_qty = 0"     # never divide by zero
# rounding      = "2 decimals, at presentation only"
# target        = "PENDING_APPROVAL"              # approved and versioned, never inferred
# owner         = "PENDING_APPROVAL"
# version       = 1

# Reusable families (Part 10.2): sum, count, average, min/max, actual vs target,
# period comparison, rolling average, growth rate, variance, rank, share of
# total, Pareto, yield, defect rate, productivity, margin, cost variance.

# Guardrails (Part 26.12):
#   - No OEE unless availability, performance and quality share an approved
#     equipment/time grain.
#   - No first-pass yield unless first-pass and rework events are distinguishable.
#   - Use weighted rates from summed numerator/denominator. Never average row
#     percentages unless the definition explicitly requires it (Part 26.5).

[approvals]
metrics = { approved_by = "", approved_at = "", evidence = "" }
