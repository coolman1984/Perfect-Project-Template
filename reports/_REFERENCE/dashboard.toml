[meta]
title = "Production Quality — Golden Reference"
decision = "Where is production loss concentrated, and which model explains most of it?"
period_query = "latest_period"

[lineage]
rows_query = "active_row_count"
mapping_version = "1"
metric_version = "1"

[[filters]]
id = "model_code"
label = "Model"
type = "multi"
[[filters]]
id = "line"
label = "Line"
type = "multi"

[[kpis]]
id = "produced_total"
query = "produced_total"
label = "Produced"
unit = "units"
format = "integer"
direction = "up_good"
[[kpis]]
id = "defect_total"
query = "defect_total"
label = "Defects"
unit = "units"
format = "integer"
direction = "down_good"
[[kpis]]
id = "defect_rate_ppm"
query = "defect_rate_ppm"
label = "Defect rate"
unit = "PPM"
format = "integer"
direction = "down_good"

[[charts]]
id = "trend"
query = "trend_by_date"
title = "Is quality improving over time?"
type = "line"
dimension = "production_date"
series_name = "Defect rate (PPM)"
x_index = 0
y_index = 3
unit = "PPM"
summary_format = "{x}: {y} PPM"
[[charts]]
id = "pareto"
query = "pareto_by_model"
title = "Which models explain most of the defects?"
type = "pareto"
dimension = "model_code"
series_name = "Defects"
x_index = 0
y_index = 1
cumulative_index = 2
unit = "units"
summary_format = "{x}: {y} defects"

[[insights]]
id = "period_change"
type = "period_change_rate"
query = "period_change_evidence"
metric_id = "defect_rate_ppm"
label = "Defect rate"
unit = "PPM"
scale = 1000000
current_period_index = 0
current_denominator_index = 1
current_numerator_index = 2
comparison_period_index = 3
comparison_denominator_index = 4
comparison_numerator_index = 5
[[insights]]
id = "top_contributor"
type = "top_contributor"
query = "top_contributor_evidence"
metric_id = "defect_qty"
value_label = "defects"
dimension_index = 0
value_index = 1
share_index = 2
