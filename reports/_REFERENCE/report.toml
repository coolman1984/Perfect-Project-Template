report_id = "_reference"
report_version = 1
mode = "prototype"
load_mode = "upsert"
timezone = "Africa/Cairo"
currency = "EGP"

[excel]
sheet = "Raw Data"
header_row = 1
data_start_row = 2
open_mode = "dedicated_then_attach"
calculation_policy = "as_saved"
data_area = "table:tblProduction"
include_hidden_rows = true
adapter = "fixture"

[extraction]
target_cells_per_chunk = 250000
min_rows_per_chunk = 2
max_rows_per_chunk = 10000
projected_columns = ["production_date", "line", "order_number", "model_code", "produced_qty", "defect_qty", "category"]

[history]
business_key = ["production_date", "line", "order_number", "model_code"]
event_date = "production_date"
lookback_days = 7
deletion_rule = "ignore"

[quality]
required_columns_block = true
max_duplicate_key_rate = 0.0
max_required_null_rate = 0.0
max_row_count_change_pct = 60.0
control_total_column = "produced_qty"
non_negative_columns = ["produced_qty", "defect_qty"]
approved_categories = ["standard", "rework"]

[output]
audience = "Production management"
storage_allowed = ["tests/expected/reference"]
retention_days = 365
ai_narrative_allowed = false

[approvals]
