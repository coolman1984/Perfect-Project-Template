name: Template checks
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  linux-verify:
    name: Linux portable + application proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: ./project_tool.sh map verify
      - run: ./project_tool.sh architecture verify --baseline
      - run: ./project_tool.sh architecture verify --source-scan
      - run: ./project_tool.sh constitution audit
      - run: ./project_tool.sh memory validate
      - run: ./project_tool.sh gates status
      - run: ./project_tool.sh report validate
      - run: python3 -m unittest discover -s tests -t . --verbose
      - name: Install application-tier CI dependencies
        run: pip install --quiet duckdb fastapi uvicorn httpx
      - name: Full suite with application-tier dependencies installed
        # The earlier `discover` ran with no application-tier dependencies, so
        # every duckdb/fastapi-gated test skipped there by design (Part 37.2
        # portable-tier proof). Re-running discovery here is what actually
        # exercises those tests; without it a new duckdb-gated test file could
        # sit in tests/ untested by CI forever, counted neither as skipped nor
        # failed by any step below because no curated list names it.
        run: python3 -m unittest discover -s tests -t . --verbose
      - name: Golden single-source + multi-source project proofs
        run: |
          python3 -m unittest tests.golden.test_reference_pipeline --verbose
          python3 -m unittest tests.golden.test_second_report_pipeline --verbose
          python3 -m unittest tests.golden.test_multisource_supply_chain --verbose
      - run: python3 -m unittest tests.factory.test_factory_flow tests.factory.test_universal_engine tests.factory.test_v81_audit_contracts tests.factory.test_v81_adaptation_commands --verbose
      - name: Local runtime, real socket and standalone export
        run: python3 -m unittest tests.unit.test_runtime_core tests.unit.test_loopback_listener tests.unit.test_standalone_html --verbose
      - run: python3 -m unittest tests.adversarial.test_approval_bypass --verbose
      - run: |
          python3 -m doctest app/excel/conversion.py -v
          python3 -m doctest app/excel/port.py
          python3 -m doctest app/local_transport.py
      - run: ./project_tool.sh gates status --severity block

  windows-verify:
    name: Windows portable + reusable-engine proof
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: BAT launcher and governance checks
        shell: cmd
        run: |
          call PROJECT_TOOL.bat map verify
          call PROJECT_TOOL.bat architecture verify --baseline
          call PROJECT_TOOL.bat architecture verify --source-scan
          call PROJECT_TOOL.bat constitution audit
          call PROJECT_TOOL.bat memory validate
          call PROJECT_TOOL.bat gates status
          call PROJECT_TOOL.bat report validate
      - name: Portable tests
        shell: cmd
        run: python -m unittest discover -s tests -t . --verbose
      - name: Workspace path with spaces and Arabic
        shell: pwsh
        run: |
          $target = Join-Path $env:TEMP 'Excel Engine عربي'
          if (Test-Path $target) { Remove-Item -Recurse -Force $target }
          New-Item -ItemType Directory -Path $target | Out-Null
          Get-ChildItem -Force | Where-Object { $_.Name -ne '.git' } | Copy-Item -Destination $target -Recurse -Force
          & (Join-Path $target 'PROJECT_TOOL.bat') doctor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install application-tier CI dependencies
        shell: cmd
        run: python -m pip install --quiet duckdb fastapi uvicorn httpx
      - name: Full suite with application-tier dependencies installed
        shell: cmd
        run: python -m unittest discover -s tests -t . --verbose
      - name: Golden single-source + multi-source project proofs
        shell: cmd
        run: |
          python -m unittest tests.golden.test_reference_pipeline --verbose
          python -m unittest tests.golden.test_second_report_pipeline --verbose
          python -m unittest tests.golden.test_multisource_supply_chain --verbose
      - name: V8.1 factory/adaptation proofs
        shell: cmd
        run: python -m unittest tests.factory.test_factory_flow tests.factory.test_universal_engine tests.factory.test_v81_audit_contracts tests.factory.test_v81_adaptation_commands --verbose
      - name: Local runtime, real socket and standalone export
        shell: cmd
        run: python -m unittest tests.unit.test_runtime_core tests.unit.test_loopback_listener tests.unit.test_standalone_html --verbose
      - name: Environment-bound gates stay conditional
        shell: cmd
        run: call PROJECT_TOOL.bat gates status --severity block
