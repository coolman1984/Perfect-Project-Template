name: Map refresh maintenance

on:
  push:
    branches: ["agent/universal-excel-automation-engine"]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/universal-excel-automation-engine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Save current generated map artifacts
        run: |
          cp .ai/MAP_MANIFEST.json "$RUNNER_TEMP/MAP_MANIFEST.before.json"
          cp .ai/PROJECT_MAP.md "$RUNNER_TEMP/PROJECT_MAP.before.md"
      - name: Refresh reviewed map artifacts
        run: ./project_tool.sh map refresh --review
      - name: Suppress timestamp-only churn
        shell: python
        run: |
          import json
          import os
          import re
          import shutil
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          old_manifest_path = temp / "MAP_MANIFEST.before.json"
          old_map_path = temp / "PROJECT_MAP.before.md"
          new_manifest_path = Path(".ai/MAP_MANIFEST.json")
          new_map_path = Path(".ai/PROJECT_MAP.md")

          old_manifest = json.loads(old_manifest_path.read_text(encoding="utf-8"))
          new_manifest = json.loads(new_manifest_path.read_text(encoding="utf-8"))
          old_manifest.pop("generated_at", None)
          new_manifest.pop("generated_at", None)

          stamp = re.compile(r"(_Generated by `PROJECT_TOOL map refresh` at )[^.]+(\. .*tracked files\. Do not hand-edit this block\._)")
          old_map = stamp.sub(r"\1<TIMESTAMP>\2", old_map_path.read_text(encoding="utf-8"))
          new_map = stamp.sub(r"\1<TIMESTAMP>\2", new_map_path.read_text(encoding="utf-8"))

          if old_manifest == new_manifest and old_map == new_map:
              shutil.copy2(old_manifest_path, new_manifest_path)
              shutil.copy2(old_map_path, new_map_path)
      - name: Commit generated map artifacts only when source content changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ai/MAP_MANIFEST.json .ai/PROJECT_MAP.md
          if git diff --cached --quiet; then
            echo "Map content unchanged; no timestamp-only commit created."
            exit 0
          fi
          git commit -m "Refresh project map for universal engine changes"
          git push origin HEAD:agent/universal-excel-automation-engine
