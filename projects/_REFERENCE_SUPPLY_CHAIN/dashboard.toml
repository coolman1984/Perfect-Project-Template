title = "Supply Chain Risk Reference"

[[kpis]]
id = "ordered_qty"
label = "Ordered quantity"
metric = "ordered_qty"

[[kpis]]
id = "fulfillment_rate"
label = "Fulfillment rate"
metric = "fulfillment_rate"

[[kpis]]
id = "on_hand_qty"
label = "On-hand quantity"
metric = "on_hand_qty"

[[charts]]
id = "shortage_by_item"
type = "bar"
title = "Shortage risk by item"
dimension = "item_id"
